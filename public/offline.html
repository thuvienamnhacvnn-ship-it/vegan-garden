<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#132213" />
    <title>Offline – Vegan Garden Berlin</title>
    <style>
      /* Self-contained on purpose: this page has to render with no network. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: #132213;
        color: #f3efe4;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6;
      }
      img { width: 84px; height: 84px; }
      h1 {
        margin: 0;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 300;
        font-size: clamp(1.8rem, 7vw, 2.5rem);
        letter-spacing: -0.02em;
      }
      p { margin: 0; max-width: 30rem; color: #b6c4b0; font-size: 0.98rem; }
      .hint { font-size: 0.82rem; color: #8fa189; }
      a {
        margin-top: 0.5rem;
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        padding: 0 2rem;
        border-radius: 999px;
        background: #d4b166;
        color: #132213;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
      }
      .phone { color: #d4b166; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="Vegan Garden" />
    <h1>Keine Verbindung</h1>
    <p>
      Diese Seite braucht eine Internetverbindung. Sobald Sie wieder online sind,
      geht es genau hier weiter.
    </p>
    <p class="hint">No connection · Không có kết nối mạng</p>
    <a href="/">Erneut versuchen</a>
    <p class="hint">
      Reservierung per Telefon:
      <a class="phone" href="tel:+493012088892">+49 30 120 88 89 2</a>
    </p>
  </body>
</html>
